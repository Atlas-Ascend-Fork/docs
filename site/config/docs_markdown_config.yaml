# ============================================================================
# 文档打包配置文件，仅包含CANN产品文档对应的markdown文件
#
# scan_all_repos:    打包整个工作区顶层的仓库
# special_tar_repos: 走特殊清单打包的仓库（md/png/jpg + examples全量）
# repo_dirs:         仓库 → 打包/扫描目录列表
#                    "**/xxx" 前缀表示按目录名xxx全仓递归匹配
# ============================================================================

scan_all_repos:
# 全仓打包
  - docs

special_tar_repos:
# 全仓扫描“*.md”、“*.jpg”、“.png”、“*.svg”
  - ops-nn
  - ops-cv
  - ops-math
  - ops-transformer

repo_dirs:
# 打包指定目录
  runtime: [docs]
  asc-devkit: [docs]
  hccl: [docs]
  hcomm: [docs]
  hixl: [docs]
  pypto: [docs]
  oam-tools: [docs]
  amct: [docs]
  ge: [docs]
  metadef: [docs]
  opbase: [docs]
  tensorflow: [docs]
