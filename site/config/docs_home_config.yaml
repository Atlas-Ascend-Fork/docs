# config/document-config.yaml
# 开源文档中心首页配置文件
# 用于管理文档分类、名称、URL及关联字段映射

# ============================================================
# 首页 Banner 配置
# ============================================================
banner:
  title: "CANN开源文档"
  description: "CANN开源文档中心，汇聚编程指南、API参考、通信库等各类技术文档，为开发者提供一站式参考。"

# ============================================================
# 免责声明
# ============================================================
disclaimer: "免责声明：本站内容基于[CANN开源社区](https://gitcode.com/cann)master分支的文档自动编译生成，属于持续开发版本，可能存在缺陷，仅供预览与参考。如需稳定发布文档，请查阅[昇腾社区-CANN产品文档](https://www.hiascend.com/document/detail/zh/CANNCommunityEdition/latest/index/index.html)。"

# ============================================================
# 文档大类定义
# ============================================================
categories:
  - id: "cat_proglang"
    name: "编程语言"

  - id: "cat_api"
    name: "API参考"

  - id: "cat_commib"
    name: "通信库"

  - id: "cat_devtools"
    name: "调试与分析工具"

  - id: "cat_compiler"
    name: "编译器"

  - id: "cat_ref"
    name: "参考"

  - id: "cat_others"
    name: "更多"

# ============================================================
# 文档列表
# ============================================================
